<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>BBB Living House — فیلڈ ڈیمو v3</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:'Noto Nastaliq Urdu','Jameel Noori Nastaleeq',serif; background:#0A1A3B; color:#F4F1EA;
         min-height:100vh; display:flex; flex-direction:column; }
  header { padding:14px 18px 8px; display:flex; justify-content:space-between; align-items:center; }
  .brand { font-size:15px; color:#9fd8cb; line-height:1.9; }
  .brand b { color:#fff; font-size:17px; }
  #counter { font-size:13px; background:#12305e; border:1px solid #2b4d82; padding:2px 12px; border-radius:20px; color:#cfe6df; line-height:2; }
  main { flex:1; display:flex; flex-direction:column; padding:6px 16px 10px; max-width:640px; width:100%; margin:0 auto; }
  .slide { display:none; flex-direction:column; animation:fade .35s ease; }
  .slide.on { display:flex; }
  @keyframes fade { from { opacity:0; transform:translateY(8px);} to { opacity:1; transform:none; } }
  .kicker { color:#3DAB94; font-size:14px; line-height:2; text-align:center; }
  h1 { font-size:27px; line-height:2.1; margin:2px 0 6px; }
  h2 { font-size:22px; line-height:2.1; margin:2px 0 4px; text-align:center; }
  p { font-size:16.5px; line-height:2.25; color:#E9E4D8; }
  .small { font-size:13.5px; color:#A9B8CC; line-height:2.1; }
  .photo { width:100%; border-radius:16px; border:1px solid #2b4d82; box-shadow:0 12px 30px rgba(0,0,0,.45); margin:8px 0 10px; }
  video { width:100%; border-radius:16px; border:1px solid #2b4d82; box-shadow:0 12px 30px rgba(0,0,0,.45); margin:8px 0 10px; background:#000; }
  .badge { align-self:center; background:#12305e; color:#9fd8cb; border:1px solid #2b4d82; font-size:13px; padding:1px 14px; border-radius:20px; line-height:2.1; margin-top:4px; }
  .bigbtn { display:block; width:100%; text-align:center; background:#3DAB94; color:#04231b; border:none; cursor:pointer;
            font-family:inherit; font-size:19px; line-height:2.3; padding:8px 10px; border-radius:14px; margin-top:12px; text-decoration:none; }
  .bigbtn.ghost { background:transparent; color:#cfe6df; border:1.5px solid #3DAB94; }
  .bigbtn:active { transform:scale(.985); }
  nav { display:flex; gap:10px; padding:10px 16px 18px; max-width:640px; width:100%; margin:0 auto; }
  nav button { flex:1; font-family:inherit; font-size:17px; line-height:2.2; padding:6px; border-radius:12px; cursor:pointer;
               background:#12305e; color:#EAF3EF; border:1px solid #2b4d82; }
  nav button.main { background:#3DAB94; color:#04231b; border:none; flex:1.4; }
  nav button:disabled { opacity:.35; }
  #dots { display:flex; gap:6px; justify-content:center; padding:2px 0 4px; flex-wrap:wrap; }
  #dots i { width:8px; height:8px; border-radius:50%; background:#2b4d82; display:block; }
  #dots i.on { background:#3DAB94; }
  .cover { text-align:center; padding-top:26px; }
  .cover .ring { width:86px; height:86px; margin:0 auto 10px; border-radius:50%; border:2.5px solid #3DAB94;
                 display:flex; align-items:center; justify-content:center; font-size:21px; color:#fff; background:#0e2650; line-height:1.6; }
  .endcard { background:#0e2650; border:1px solid #2b4d82; border-radius:16px; padding:16px; margin-top:10px; }
  ul.feat { list-style:none; margin:4px 0 2px; }
  ul.feat li { font-size:16px; line-height:2.2; color:#E9E4D8; padding-right:22px; position:relative; }
  ul.feat li:before { content:'•'; color:#3DAB94; position:absolute; right:4px; font-size:20px; }
</style>
